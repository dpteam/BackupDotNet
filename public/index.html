<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BackupDotNet · Мониторинг</title>
<link rel="icon" href="img/favicon.ico" id="brand-favicon">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="description" content="Мониторинг бэкапов, доступности и железа">
<meta name="theme-color" content="#0088FF">
<link rel="stylesheet" href="vendor/fa/css/all.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ============================================================ вход -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">
        <img src="img/logo.png" alt="" class="logo-light brand-logo-light">
        <img src="img/logo-dark.png" alt="" class="logo-dark brand-logo-dark">
      </div>
      <h1><span class="bt-brand brand-part1"></span><span class="bt-rest brand-part2"></span></h1>
      <p class="login-tagline brand-tagline"></p>
    </div>
    <form id="login-form" autocomplete="on">
      <label>Пользователь</label>
      <input type="text" name="username" value="admin" required>
      <label>Пароль</label>
      <input type="password" name="password" required>
      <button type="submit" class="btn btn-primary btn-block">
        <i class="fas fa-sign-in-alt"></i> Войти
      </button>
      <div id="login-error" class="login-error hidden"></div>
    </form>
    <div class="login-footer">
      <a href="#" target="_blank" rel="noopener" class="brand-footer-url"></a>
      <span class="footer-sep">·</span>
      <a href="#" id="theme-toggle-login"><i class="fas fa-adjust"></i> Тема</a>
    </div>
  </div>
</div>

<!-- ============================================================ приложение -->
<div id="app" class="app hidden">

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/dashboard">
        <span class="brand-logo-wrap">
          <img src="img/logo.png" alt="" class="brand-logo logo-light brand-logo-light">
          <img src="img/logo-dark.png" alt="" class="brand-logo logo-dark brand-logo-dark">
        </span>
        <span class="brand-text"><span class="bt-brand brand-part1"></span><span class="bt-rest brand-part2"></span></span>
      </a>

      <div class="nav-scroll" id="nav-scroll">
        <button class="nav-arrow left hidden" id="nav-prev" title="Назад"><i class="fas fa-chevron-left"></i></button>

        <nav class="nav" id="nav">
          <a href="#/dashboard" data-nav="dashboard"><i class="fas fa-tachometer-alt"></i> <span>Дашборд</span></a>

          <div class="nav-group" data-group="monitor">
            <button type="button" class="nav-group-btn"><i class="fas fa-heartbeat"></i> Мониторинг <i class="fas fa-chevron-down caret"></i></button>
            <div class="nav-menu">
              <a href="#/uptime" data-nav="uptime"><i class="fas fa-heartbeat"></i> Доступность</a>
              <a href="#/month" data-nav="month"><i class="fas fa-table"></i> Таблица</a>
              <a href="#/journal" data-nav="journal"><i class="fas fa-list-ul"></i> Журнал</a>
              <a href="#/health" data-nav="health"><i class="fas fa-stethoscope"></i> Здоровье</a>
            </div>
          </div>

          <div class="nav-group" data-group="infra">
            <button type="button" class="nav-group-btn"><i class="fas fa-server"></i> Инфраструктура <i class="fas fa-chevron-down caret"></i></button>
            <div class="nav-menu">
              <a href="#/backups" data-nav="backups"><i class="fas fa-archive"></i> Бэкапы</a>
              <a href="#/inventory" data-nav="inventory"><i class="fas fa-server"></i> Инвентарь</a>
              <a href="#/network" data-nav="network"><i class="fas fa-network-wired"></i> Сеть</a>
            </div>
          </div>

          <div class="nav-group" data-group="ops">
            <button type="button" class="nav-group-btn"><i class="fas fa-sliders-h"></i> Управление <i class="fas fa-chevron-down caret"></i></button>
            <div class="nav-menu">
              <a href="#/deploy" data-nav="deploy" id="nav-deploy" class="hidden"><i class="fas fa-cloud-upload-alt"></i> Развёртывание</a>
              <a href="#/manage" data-nav="manage" id="nav-manage" class="hidden"><i class="fas fa-sliders-h"></i> Управление</a>
            </div>
          </div>

          <div class="nav-group" data-group="admin">
            <button type="button" class="nav-group-btn"><i class="fas fa-user-shield"></i> Админ <i class="fas fa-chevron-down caret"></i></button>
            <div class="nav-menu">
              <a href="#/users" data-nav="users" id="nav-users" class="hidden"><i class="fas fa-users"></i> Пользователи</a>
              <a href="#/logs" data-nav="logs" id="nav-logs" class="hidden"><i class="fas fa-file-alt"></i> Журналы</a>
              <a href="#/audit" data-nav="audit" id="nav-audit" class="hidden"><i class="fas fa-user-shield"></i> Аудит</a>
              <a href="#/settings" data-nav="settings"><i class="fas fa-cog"></i> Настройки</a>
            </div>
          </div>
        </nav>

        <button class="nav-arrow right hidden" id="nav-next" title="Вперёд"><i class="fas fa-chevron-right"></i></button>
      </div>

      <div class="topbar-right">
        <button class="icon-btn bell-btn" id="btn-bell" title="Уведомления">
          <i class="fas fa-bell"></i>
          <span class="bell-badge hidden" id="bell-badge">0</span>
        </button>
        <button class="icon-btn" id="btn-refresh" title="Обновить"><i class="fas fa-sync-alt"></i></button>
        <button class="icon-btn theme-btn" id="btn-theme" title="Сменить тему">
          <i class="fas fa-sun theme-icon-sun"></i>
          <i class="fas fa-moon theme-icon-moon"></i>
        </button>
        <button class="icon-btn" id="btn-logout" title="Выйти"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </div>
  </header>

  <div id="bell-panel" class="bell-panel hidden">
    <div class="bell-head">
      <i class="fas fa-bell"></i> Уведомления
      <span class="spacer"></span>
      <button class="btn btn-sm" id="bell-close"><i class="fas fa-times"></i></button>
    </div>
    <div class="bell-list" id="bell-list"></div>
  </div>

  <main class="content">
    <div id="view"></div>
  </main>

  <footer class="footer">
    <span>© <span class="brand-footer-text"></span><span class="footer-sep"> · </span><a href="#" target="_blank" rel="noopener" class="brand-footer-url"></a></span>
    <span id="footer-status" class="muted"></span>
  </footer>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/app.js"></script>
</body>
</html>
